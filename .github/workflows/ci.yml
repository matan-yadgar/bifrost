name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          gofmt -l . | tee "$RUNNER_TEMP/gofmt-files"
          test ! -s "$RUNNER_TEMP/gofmt-files"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test with race detector
        run: go test ./... -race

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          only-new-issues: true

      - name: Compile Windows harness tests
        run: GOOS=windows GOARCH=amd64 go test -c -o "$RUNNER_TEMP/bifrost-harness.test.exe" ./internal/harness
